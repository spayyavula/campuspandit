    <!-- Structured Data: FAQPage (Princeton GEO research: +40% AI citation rate) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CampusPandit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CampusPandit is a white-label coaching center platform for JEE and NEET prep institutes in India. Each coaching center gets a branded student app (their logo, their domain), an AI Coach that diagnoses every student's weakest chapters based on PYQ frequency, and a single dashboard to manage leads, enrollments, fees, attendance, mock scores, and parent communications."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to launch a branded app for our coaching center?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Seven days from the discovery call to a Play Store-published Android app with your logo, colors, and domain. iOS publishing follows in approximately three weeks due to Apple's review timeline. No engineering work is required from your team."
          }
        },
        {
          "@type": "Question",
          "name": "Who owns the content, recordings, and student data on CampusPandit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your coaching center owns all content, video recordings, student records, and CRM data. CampusPandit is a processor under your control. Full export is available in CSV, MP4, and PDF formats on request, and immediately on contract exit."
          }
        },
        {
          "@type": "Question",
          "name": "How does CampusPandit pricing work for coaching centers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pricing is per active student per month, billed annually. Growth tier is INR 149 per active student per month with a minimum of 100 students. Center+ tier (500+ students, multi-branch) uses custom pricing. The current Founding 10 pilot cohort runs free for the first three months and locks in founder pricing for life."
          }
        },
        {
          "@type": "Question",
          "name": "How are student payments handled?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Students pay your coaching center directly through Razorpay, PayU, or Instamojo accounts owned by the center. CampusPandit invoices the center separately for the platform fee and never sits between your center and student payments."
          }
        },
        {
          "@type": "Question",
          "name": "Can the AI Coach be tuned to our center's curriculum?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The base AI Coach is pre-tuned on every JEE Main paper since 2015, JEE Advanced since 2010, and NEET UG since 2017. For Center+ clients, the AI is fine-tuned on your past mock papers, assignment sets, and chapter weightages so it emphasizes what your center teaches."
          }
        }
      ]
    }
    </script>

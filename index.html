        "Physics",
        "Chemistry",
        "Mathematics",
        "Biology",

      ],

    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CampusPandit",
      "url": "https://campuspandit.com",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://campuspandit.com/courses?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Service (online tutoring) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "CampusPandit AI Coach &amp; Live Tutoring",
      "serviceType": "Online Tutoring",
      "provider": {
        "@type": "EducationalOrganization",
        "name": "CampusPandit",
        "url": "https://campuspandit.com"
      },
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free for first 6 months. AI Coach, flashcards, video library, progress tracking."
        },
        {
          "@type": "Offer",
          "name": "Student Pro",
          "price": "799",
          "priceCurrency": "INR",
          "description": "Unlimited AI Coach, 2 tutor session credits per month, unlimited tutor messaging."
        },
        {
          "@type": "Offer",
          "name": "Pay per session",
          "price": "499",
          "priceCurrency": "INR",
          "description": "Per-hour live tutor sessions, no subscription required."
        }
      ]
    }
    </script>

    <!-- Structured Data: FAQPage (Princeton GEO research: +40% AI citation rate) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CampusPandit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CampusPandit is an AI-powered tutoring platform for JEE and NEET aspirants. It combines a personalized AI coach that identifies weak chapters, live 1:1 video sessions with expert tutors, and a video library of recorded chapter explainers — all in one app. Indian students get the first 6 months free with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI Coach work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a short diagnostic quiz, the AI Coach analyzes which chapters and problem types you struggle with most. It then builds a weekly practice plan using spaced repetition, recommends targeted video lessons, and tracks your accuracy chapter by chapter. The coach updates the plan each week based on your latest performance."
          }
        },
        {
          "@type": "Question",
          "name": "How much does CampusPandit cost in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CampusPandit is free for the first 6 months — no credit card required. After that, Student Pro is ₹799 per month and includes unlimited AI Coach conversations, 2 included tutor session credits monthly, and unlimited tutor messaging. Pay-per-session live tutoring starts at ₹499 per hour with no subscription."
          }
        },
        {
          "@type": "Question",
          "name": "Is CampusPandit suitable for JEE Main, JEE Advanced, and NEET preparation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CampusPandit's syllabi for Physics, Chemistry, Mathematics, and Biology are aligned with the current JEE Main, JEE Advanced, and NEET UG specifications. Content covers both Class 11 and Class 12 chapters, and the AI Coach adapts practice problems to your target exam."
          }
        },
        {
          "@type": "Question",
          "name": "Can I book a live tutor through CampusPandit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can book 1:1 video tutoring sessions on demand, often within minutes. Sessions include video, screen sharing, an interactive whiteboard, and are automatically recorded so you can rewatch them later. Tutors set their own rates starting at ₹499 per hour, and you can browse profiles, ratings, and subject specialties before booking."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install anything to use CampusPandit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. CampusPandit runs entirely in your browser as a Progressive Web App, so it works on any laptop or phone with a modern browser. You can also install it to your home screen for an app-like experience without going through an app store."
          }
        }
      ]
    }
    </script>
